apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpe-backend
  namespace: gpe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gpe
  template:
    metadata:
      labels:
        app: gpe
    spec:
      containers:
      - name: gpe-api
        image: etnauser/gpe-backend:0.2.0
        ports:
        - containerPort: 8080
        envFrom:
        - secretRef:
            name: gpe-secrets
        # Telegram bot credentials (token + webhook secret). Created out of band:
        #   kubectl create secret generic gpe-telegram -n gpe \
        #     --from-literal=TELEGRAM_BOT_TOKEN=... \
        #     --from-literal=TELEGRAM_WEBHOOK_SECRET=...
        - secretRef:
            name: gpe-telegram
        env:
        - name: TELEGRAM_BOT_USERNAME
          value: "safemobileapp_bot"
        # Allow-list for blob_url downloads: anything outside these prefixes is
        # refused (SSRF guard). Empty disables audio delivery to contacts.
        - name: TELEGRAM_AUDIO_ALLOWED_URLS
          value: "http://minio-service:9000/audio-bucket/"
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds:
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: gpe-service
  namespace: gpe
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  type: NodePort
  selector:
    app: gpe
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
      nodePort: 30001