apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpe-backend
  namespace: gpe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gpe
  template:
    metadata:
      labels:
        app: gpe
    spec:
      containers:
      - name: gpe-api
        image: etnauser/gpe-backend:0.1.1
        ports:
        - containerPort: 8080
        envFrom:
        - secretRef:
            name: gpe-secrets
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds:
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: gpe-service
  namespace: gpe
spec:
  type: NodePort
  selector:
    app: gpe
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
      nodePort: 30001