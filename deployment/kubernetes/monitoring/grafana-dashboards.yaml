apiVersion: v1
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /etc/grafana/provisioning/dashboards
  fiber.json: |
    {
      "uid": "6bnfeorMz",
      "title": "GPE Backend — API & Runtime",
      "description": "Trafic, latence, erreurs et runtime du backend Fiber (namespace gpe).",
      "tags": ["gpe", "fiber", "backend"],
      "timezone": "browser",
      "editable": true,
      "graphTooltip": 1,
      "refresh": "30s",
      "schemaVersion": 39,
      "version": 1,
      "time": { "from": "now-6h", "to": "now" },
      "timepicker": { "refresh_intervals": ["10s", "30s", "1m", "5m", "15m"] },
      "annotations": { "list": [] },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": { "selected": true, "text": "Prometheus", "value": "Prometheus" },
            "hide": 0,
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false
          },
          {
            "name": "instance",
            "label": "Instance",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "${datasource}" },
            "definition": "label_values(http_requests_total, instance)",
            "query": { "query": "label_values(http_requests_total, instance)", "refId": "StandardVariableQuery" },
            "refresh": 1,
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "current": { "selected": true, "text": ["All"], "value": ["$__all"] },
            "sort": 1,
            "hide": 0
          },
          {
            "name": "path",
            "label": "Endpoint",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "${datasource}" },
            "definition": "label_values(http_requests_total, path)",
            "query": { "query": "label_values(http_requests_total, path)", "refId": "StandardVariableQuery" },
            "refresh": 1,
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "current": { "selected": true, "text": ["All"], "value": ["$__all"] },
            "sort": 1,
            "hide": 0
          },
          {
            "name": "interval",
            "label": "Intervalle",
            "type": "interval",
            "query": "1m,5m,15m,30m",
            "current": { "selected": true, "text": "5m", "value": "5m" },
            "auto": false,
            "hide": 0
          }
        ]
      },
      "panels": [
        {
          "type": "row",
          "title": "Vue d'ensemble",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "panels": []
        },
        {
          "type": "stat",
          "title": "Requêtes (période)",
          "description": "Nombre de requêtes HTTP sur la période sélectionnée.",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 1 },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(increase(http_requests_total{instance=~\"$instance\", path=~\"$path\"}[$__range]))",
              "legendFormat": "requêtes",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "color": { "mode": "thresholds" },
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto",
            "justifyMode": "auto",
            "orientation": "auto"
          }
        },
        {
          "type": "stat",
          "title": "Erreurs 5xx",
          "description": "Part des réponses 5xx sur le total des requêtes.",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 5, "w": 6, "x": 6, "y": 1 },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "100 * (sum(rate(http_requests_total{instance=~\"$instance\", path=~\"$path\", status_code=~\"5..\"}[$interval])) or on() vector(0)) / clamp_min(sum(rate(http_requests_total{instance=~\"$instance\", path=~\"$path\"}[$interval])), 0.000001)",
              "legendFormat": "%",
              "instant": false,
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 2,
              "min": 0,
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "#EAB839", "value": 1 },
                  { "color": "red", "value": 5 }
                ]
              },
              "mappings": [],
              "noValue": "aucun trafic"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto",
            "justifyMode": "auto",
            "orientation": "auto"
          }
        },
        {
          "type": "stat",
          "title": "Latence p95",
          "description": "95e percentile de la durée des requêtes (secondes).",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 5, "w": 6, "x": 12, "y": 1 },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{instance=~\"$instance\", path=~\"$path\"}[$interval])))",
              "legendFormat": "p95",
              "instant": false,
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 3,
              "min": 0,
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "#EAB839", "value": 0.3 },
                  { "color": "red", "value": 1 }
                ]
              },
              "mappings": [],
              "noValue": "aucun trafic"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto",
            "justifyMode": "auto",
            "orientation": "auto"
          }
        },
        {
          "type": "stat",
          "title": "Requêtes en cours",
          "description": "Requêtes actuellement en cours de traitement.",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 5, "w": 6, "x": 18, "y": 1 },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(http_requests_in_progress_total{instance=~\"$instance\"})",
              "legendFormat": "en cours",
              "instant": false,
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "color": { "mode": "thresholds" },
              "thresholds": { "mode": "absolute", "steps": [{ "color": "blue", "value": null }] },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto",
            "justifyMode": "auto",
            "orientation": "auto"
          }
        },
        {
          "type": "row",
          "title": "Trafic",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 6 },
          "panels": []
        },
        {
          "type": "table",
          "title": "Requêtes par endpoint",
          "description": "Nombre de requêtes sur la période, tous codes confondus.",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 7 },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "topk(10, sum by (path) (increase(http_requests_total{instance=~\"$instance\", path=~\"$path\"}[$__range])))",
              "format": "time_series",
              "instant": true,
              "range": false
            }
          ],
          "transformations": [
            { "id": "labelsToFields", "options": { "mode": "columns" } },
            { "id": "merge", "options": {} },
            {
              "id": "organize",
              "options": {
                "excludeByName": { "Time": true },
                "renameByName": { "Value": "requêtes", "path": "endpoint" }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "noValue": "aucune requête",
              "custom": { "align": "auto", "cellOptions": { "type": "auto" } }
            },
            "overrides": []
          },
          "options": { "showHeader": true, "sortBy": [{ "displayName": "requêtes", "desc": true }] }
        },
        {
          "type": "bargauge",
          "title": "Requêtes par code HTTP",
          "description": "Nombre de réponses par code sur la période.",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 7 },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum by (status_code) (increase(http_requests_total{instance=~\"$instance\", path=~\"$path\"}[$__range]))",
              "legendFormat": "{{status_code}}",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "min": 0,
              "color": { "mode": "fixed", "fixedColor": "blue" },
              "mappings": [],
              "noValue": "aucune requête"
            },
            "overrides": [
              {
                "matcher": { "id": "byRegexp", "options": "2\\d{2}" },
                "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "green" } }]
              },
              {
                "matcher": { "id": "byRegexp", "options": "3\\d{2}" },
                "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "blue" } }]
              },
              {
                "matcher": { "id": "byRegexp", "options": "4\\d{2}" },
                "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "orange" } }]
              },
              {
                "matcher": { "id": "byRegexp", "options": "5\\d{2}" },
                "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "red" } }]
              }
            ]
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "displayMode": "basic",
            "orientation": "horizontal",
            "showUnfilled": true,
            "valueMode": "text"
          }
        },
        {
          "type": "row",
          "title": "Latence",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 15 },
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "Latence globale (p50 / p95 / p99)",
          "description": "Percentiles de la durée des requêtes, en secondes.",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "histogram_quantile(0.50, sum by (le) (rate(http_request_duration_seconds_bucket{instance=~\"$instance\", path=~\"$path\"}[$interval])))",
              "legendFormat": "p50",
              "instant": false,
              "range": true
            },
            {
              "refId": "B",
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{instance=~\"$instance\", path=~\"$path\"}[$interval])))",
              "legendFormat": "p95",
              "instant": false,
              "range": true
            },
            {
              "refId": "C",
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket{instance=~\"$instance\", path=~\"$path\"}[$interval])))",
              "legendFormat": "p99",
              "instant": false,
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 3,
              "custom": { "lineWidth": 1, "fillOpacity": 0, "showPoints": "never", "spanNulls": true }
            },
            "overrides": []
          },
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          }
        },
        {
          "type": "timeseries",
          "title": "Latence p95 par endpoint",
          "description": "Les 8 endpoints les plus lents au 95e percentile.",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "topk(8, histogram_quantile(0.95, sum by (path, le) (rate(http_request_duration_seconds_bucket{instance=~\"$instance\", path=~\"$path\"}[$interval]))))",
              "legendFormat": "{{path}}",
              "instant": false,
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 3,
              "custom": { "lineWidth": 1, "fillOpacity": 0, "showPoints": "never", "spanNulls": true }
            },
            "overrides": []
          },
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          }
        },
        {
          "type": "row",
          "title": "Erreurs",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 24 },
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "Requêtes en erreur (4xx / 5xx)",
          "description": "Débit des réponses client (4xx) et serveur (5xx).",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 25 },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum by (status_code) (rate(http_requests_total{instance=~\"$instance\", path=~\"$path\", status_code=~\"[45]..\"}[$interval]))",
              "legendFormat": "{{status_code}}",
              "instant": false,
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "decimals": 2,
              "noValue": "aucune erreur sur la période",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 25,
                "showPoints": "never",
                "spanNulls": true,
                "stacking": { "mode": "normal", "group": "A" }
              }
            },
            "overrides": [
              {
                "matcher": { "id": "byRegexp", "options": "4\\d{2}" },
                "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "orange" } }]
              },
              {
                "matcher": { "id": "byRegexp", "options": "5\\d{2}" },
                "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "red" } }]
              }
            ]
          },
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          }
        },
        {
          "type": "table",
          "title": "Top endpoints en erreur",
          "description": "Nombre d'erreurs cumulées sur la période affichée.",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 16, "x": 8, "y": 25 },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "topk(10, sum by (path, status_code) (increase(http_requests_total{instance=~\"$instance\", path=~\"$path\", status_code=~\"[45]..\"}[$__range])))",
              "format": "time_series",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "short", "decimals": 0, "noValue": "aucune erreur sur la période", "custom": { "align": "auto", "cellOptions": { "type": "auto" } } },
            "overrides": []
          },
          "transformations": [
            { "id": "labelsToFields", "options": { "mode": "columns" } },
            { "id": "merge", "options": {} },
            {
              "id": "organize",
              "options": {
                "excludeByName": { "Time": true },
                "renameByName": { "Value": "erreurs", "path": "endpoint", "status_code": "code" }
              }
            }
          ],
          "options": { "showHeader": true, "sortBy": [{ "displayName": "erreurs", "desc": true }] }
        },
        {
          "type": "row",
          "title": "Processus Go",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 33 },
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "Goroutines",
          "description": "Nombre de goroutines actives.",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 7, "w": 5, "x": 0, "y": 34 },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "go_goroutines{instance=~\"$instance\"}",
              "legendFormat": "{{instance}}",
              "instant": false,
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "custom": { "lineWidth": 1, "fillOpacity": 10, "showPoints": "never", "spanNulls": true }
            },
            "overrides": []
          },
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          }
        },
        {
          "type": "timeseries",
          "title": "Mémoire",
          "description": "Mémoire résidente du processus et mémoire heap allouée.",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 7, "w": 9, "x": 5, "y": 34 },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "process_resident_memory_bytes{instance=~\"$instance\"}",
              "legendFormat": "RSS",
              "instant": false,
              "range": true
            },
            {
              "refId": "B",
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "go_memstats_alloc_bytes{instance=~\"$instance\"}",
              "legendFormat": "heap alloué",
              "instant": false,
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "decimals": 1,
              "custom": { "lineWidth": 1, "fillOpacity": 10, "showPoints": "never", "spanNulls": true }
            },
            "overrides": []
          },
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          }
        },
        {
          "type": "timeseries",
          "title": "CPU",
          "description": "Consommation CPU du processus, en cœurs.",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 7, "w": 5, "x": 14, "y": 34 },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "rate(process_cpu_seconds_total{instance=~\"$instance\"}[$interval])",
              "legendFormat": "{{instance}}",
              "instant": false,
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 3,
              "custom": { "lineWidth": 1, "fillOpacity": 10, "showPoints": "never", "spanNulls": true }
            },
            "overrides": []
          },
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          }
        },
        {
          "type": "timeseries",
          "title": "Descripteurs de fichiers",
          "description": "FD ouverts par le processus, comparés à la limite.",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 7, "w": 5, "x": 19, "y": 34 },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "process_open_fds{instance=~\"$instance\"}",
              "legendFormat": "ouverts",
              "instant": false,
              "range": true
            },
            {
              "refId": "B",
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "process_max_fds{instance=~\"$instance\"}",
              "legendFormat": "max",
              "instant": false,
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "custom": { "lineWidth": 1, "fillOpacity": 0, "showPoints": "never", "spanNulls": true }
            },
            "overrides": []
          },
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          }
        }
      ]
    }
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: gpe
