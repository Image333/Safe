apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cloudbeaver-data-pvc
  namespace: gpe
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudbeaver
  namespace: gpe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudbeaver
  template:
    metadata:
      labels:
        app: cloudbeaver
    spec:
      containers:
        - name: cloudbeaver
          image: dbeaver/cloudbeaver:latest
          ports:
            - containerPort: 8978
          env:
            - name: CB_SAMPLE_DATA
              value: "false"
          volumeMounts:
            - name: cloudbeaver-data
              mountPath: /opt/cloudbeaver/workspace
      volumes:
        - name: cloudbeaver-data
          persistentVolumeClaim:
            claimName: cloudbeaver-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: cloudbeaver-service
  namespace: gpe
spec:
  type: NodePort
  ports:
    - port: 8978
      targetPort: 8978
      nodePort: 30978
  selector:
    app: cloudbeaver
